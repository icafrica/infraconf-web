<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 48" fill="none">
  <!-- Subnet Data Bus Connector Trace -->
  <line x1="13" y1="27" x2="47" y2="27" stroke="#7FFFC5" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Letter 'i' — Server Node Status Pillar -->
  <line x1="13" y1="20" x2="13" y2="34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="13" cy="12" r="2.5" fill="#7FFFC5"/>
  <circle cx="13" cy="12" r="4.5" fill="#7FFFC5" opacity="0.4"/>

  <!-- Letter 'c' — Container / Network Loop -->
  <path d="M 31 20 Q 22 20 22 27 Q 22 34 31 34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="31" cy="20" r="1.5" fill="#7FFFC5"/>

  <!-- Letter 'a' — Cluster Node / Gateway Apex -->
  <path d="M 39 34 L 47 20 L 55 34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="42" y1="28" x2="52" y2="28" stroke="#E8A030" stroke-width="3" stroke-linecap="round"/>
  <circle cx="47" cy="20" r="2" fill="#E8A030"/>
</svg>
