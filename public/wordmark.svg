<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!--
    InfraConf Africa — Full Wordmark
    Mark (68×48 server chip) + Logotype
  -->

  <!-- ── MARK ── positioned left, vertically centred -->
  <g transform="translate(6, 8)">
    <!-- Outer Server Module Chip -->
    <rect x="0.75" y="0.75" width="66.5" height="46.5" rx="9.25" fill="#091810" stroke="#1D402B" stroke-width="1.5"/>

    <!-- Background Tech Grid / Circuit Traces -->
    <path d="M 6 16 H 62 M 6 32 H 62" stroke="#7FFFC5" stroke-width="0.8" opacity="0.12" stroke-dasharray="2 4"/>
    <path d="M 13 6 V 42 M 34 6 V 42 M 55 6 V 42" stroke="#7FFFC5" stroke-width="0.8" opacity="0.12" stroke-dasharray="2 4"/>

    <!-- Letter 'i' — Server Node Status Pillar -->
    <line x1="13" y1="20" x2="13" y2="34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="13" cy="12" r="2.5" fill="#7FFFC5"/>
    <circle cx="13" cy="12" r="4.5" fill="#7FFFC5" opacity="0.25"/>

    <!-- Letter 'c' — Container / Network Loop -->
    <path d="M 31 20 Q 22 20 22 27 Q 22 34 31 34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="20" r="1.5" fill="#7FFFC5"/>

    <!-- Letter 'a' — Cluster Node / Gateway Apex -->
    <path d="M 39 34 L 47 20 L 55 34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="28" x2="52" y2="28" stroke="#E8A030" stroke-width="3" stroke-linecap="round"/>
    <circle cx="47" cy="20" r="2" fill="#E8A030"/>
  </g>

  <!-- ── LOGOTYPE ── -->
  <!-- Primary wordmark: "infraconf" -->
  <text
    x="84" y="34"
    font-family="'DM Serif Display', Georgia, serif"
    font-size="22"
    font-style="italic"
    fill="#1D4C37"
    letter-spacing="-0.5"
  >infraconf</text>

  <!-- Secondary wordmark: "africa" smaller, caps-spaced -->
  <text
    x="84" y="52"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="10"
    fill="#7FFFC5"
    letter-spacing="4"
    text-transform="uppercase"
  >AFRICA</text>

  <!-- Decorative rule between africa label and mark -->
  <line x1="84" y1="56" x2="268" y2="56" stroke="#C8E8D8" stroke-width="0.5"/>
</svg>
